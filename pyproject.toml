[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rsna-knee-top100"
version = "0.1.0"
description = "Reproducible Kaggle pipeline for RSNA Knee Abnormality Detection"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "pydicom>=2.4,<4",
  "PyYAML>=6,<7",
  "scikit-learn>=1.3,<2",
  "torch>=2.2,<3",
  "timm>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=7,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

